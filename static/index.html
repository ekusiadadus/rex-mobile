<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111419">
    <title>Rex Mobile</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/vendor/terminal.bundle.js" defer></script>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">▸</span><div><strong>Rex Mobile</strong><small>Mac の既存セッション</small></div></div>
        <button id="refresh" class="icon-button" type="button" title="更新" aria-label="更新">↻</button>
      </header>

      <section class="target-panel" aria-label="表示する端末">
        <label for="session">セッション</label>
        <select id="session"><option value="">読み込み中…</option></select>
        <label for="block">端末</label>
        <select id="block" disabled><option value="">選択してください</option></select>
      </section>

      <section class="terminal-panel" aria-label="端末画面">
        <div class="terminal-toolbar">
          <div class="terminal-title"><span class="live-dot" id="live-dot" aria-hidden="true"></span><span id="screen-title">画面</span></div>
          <div class="terminal-tools">
            <button id="font-down" type="button" aria-label="文字を小さく">A−</button>
            <button id="font-up" type="button" aria-label="文字を大きく">A＋</button>
          </div>
        </div>
        <div id="screen-scroll" class="screen-scroll" role="region" aria-label="端末の出力" tabindex="0"><div id="terminal-host" hidden></div><pre id="screen">端末を選択してください。</pre></div>
        <div class="terminal-footer"><span id="status" role="status" aria-live="polite">接続中…</span><label class="small-check"><input id="auto-scroll" type="checkbox" checked> 最下部へ</label></div>
      </section>

      <section class="input-panel" aria-label="端末への入力">
        <div class="input-heading"><div><h2>入力</h2><p>「送信して Enter」で実行。「文字だけ送信」は確定せず入力します。複数行の送信には未対応です。</p></div><label class="switch"><input id="input-enable" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span>入力を有効にする</span></label></div>
        <form id="input-form"><label class="sr-only" for="input-text">送信する文字</label><textarea id="input-text" rows="2" placeholder="ここに入力" disabled></textarea><div class="input-actions"><button id="send-text" class="primary-button" type="submit" disabled>送信して Enter</button><button id="send-raw" class="secondary-button" type="button" disabled>文字だけ送信</button></div></form>
        <p id="input-status" class="input-status" role="status" aria-live="polite"></p>
        <div class="key-grid" aria-label="キーを送信">
          <button type="button" data-key="enter">Enter ↵</button><button type="button" data-key="tab">Tab ⇥</button><button type="button" data-key="escape">Esc</button><button type="button" data-key="backspace">⌫</button>
          <button type="button" data-key="left">←</button><button type="button" data-key="up">↑</button><button type="button" data-key="down">↓</button><button type="button" data-key="right">→</button>
        </div>
        <details class="interrupt-keys"><summary>中断・終了</summary><div class="key-grid" aria-label="中断・終了キー"><button type="button" data-key="ctrl+c">Ctrl C · 中断</button><button type="button" data-key="ctrl+d">Ctrl D · 入力終了</button></div></details>
      </section>
    </main>
  </body>
</html>
